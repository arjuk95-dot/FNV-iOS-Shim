name: Check native media and input
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  media:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash tests/run.sh
      - run: python3 tests/audio_shims_test.py
      - run: python3 tests/dsound_lifetime_test.py --reference
      - run: python3 tests/dsound_lifetime_test.py
      - run: python3 tests/dshow_source_test.py --reference
      - run: python3 tests/dshow_source_test.py
      - run: gh run download 41685697032 --repo "$GITHUB_REPOSITORY" --name FNV-public-codecs-macos --dir build/codecs-macos
      - run: python3 tests/vorbis_bridge_test.py build/codecs-macos
      - run: python3 tests/bink_shims_test.py
      - run: python3 tests/native_video_test.py
      - run: python3 tests/input_display_test.py
      - run: python3 tests/guest_diagnostics_test.py
      - run: python3 tests/display_preferences_test.py --reference
      - run: python3 tests/display_preferences_test.py
      - run: gh run download 41685697032 --repo "$GITHUB_REPOSITORY" --name FNV-public-codecs-ios --dir build/codecs-ios
      - run: python3 tools/build.py host-check --codec-prefix build/codecs-ios
      - run: python3 tools/startup_build.py --host-check --out build/startup
