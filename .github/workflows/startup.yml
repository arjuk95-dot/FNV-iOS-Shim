name: Diagnose startup before another phone build
on:
  workflow_dispatch:
    inputs:
      input_tag:
        description: Optional owner-approved private input release; empty checks only the public host
        type: string
      input_sha256:
        description: Exact private input archive SHA-256
        type: string
      executable_sha256:
        description: Exact locally analyzed executable SHA-256
        type: string
      discovery:
        description: Also link the separate Mac-only Unicorn discovery binary
        type: boolean
        default: false
      cache_run_id:
        description: Optional prior private run with one-day native object artifact
        type: string
      trace_entries:
        description: Optional comma-separated guest entries for read-only receiver/argument probes
        type: string
      differential_entries:
        description: Optional comma-separated entries to compare against original x86
        type: string
      trace_returns:
        description: Optional comma-separated callees whose completed returns are logged
        type: string
      snapshot_run_id:
        description: Optional prior private diagnostic snapshot run for CRT differential replay
        type: string
permissions:
  contents: read
  actions: read
jobs:
  startup:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_TAG: ${{ inputs.input_tag }}
      INPUT_SHA256: ${{ inputs.input_sha256 }}
      EXE_SHA256: ${{ inputs.executable_sha256 }}
      CACHE_RUN_ID: ${{ inputs.cache_run_id }}
      TRACE_ENTRIES: ${{ inputs.trace_entries }}
      DIFF_ENTRIES: ${{ inputs.differential_entries }}
      TRACE_RETURNS: ${{ inputs.trace_returns }}
      SNAPSHOT_RUN_ID: ${{ inputs.snapshot_run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify startup failure gate
        run: python3 tests/startup_gate_test.py
      - name: Install optional Mac discovery dependency
        if: inputs.discovery
        run: brew install unicorn
      - name: Check native diagnostic host without game inputs
        if: inputs.input_tag == ''
        run: |
          extra=()
          if [ '${{ inputs.discovery }}' = true ]; then extra=(--discovery-prefix "$(brew --prefix unicorn)"); fi
          python3 tools/startup_build.py --host-check --out build/startup "${extra[@]}"
          build/startup/fnv-startup
      - name: Require private repository and validate approved inputs
        if: inputs.input_tag != ''
        run: |
          set -eu
          test '${{ github.event.repository.private }}' = true
          mkdir "$RUNNER_TEMP/fnv-download"
          gh release download "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --pattern fnv-game-inputs.zip --dir "$RUNNER_TEMP/fnv-download"
          python3 tools/game_inputs.py unpack "$RUNNER_TEMP/fnv-download/fnv-game-inputs.zip" "$RUNNER_TEMP/fnv-private" --archive-sha256 "$INPUT_SHA256" --exe-sha256 "$EXE_SHA256"
      - name: Compile native diagnostic with the translated game
        id: native_build
        if: inputs.input_tag != ''
        run: |
          extra=()
          if [ '${{ inputs.discovery }}' = true ]; then extra=(--discovery-prefix "$(brew --prefix unicorn)"); fi
          if [ -n "$CACHE_RUN_ID" ]; then
            case "$CACHE_RUN_ID" in *[!0-9]*) exit 1;; esac
            gh run download "$CACHE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name FNV-native-objects-private --dir build/native-objects
          fi
          python3 tools/startup_build.py --generated "$RUNNER_TEMP/fnv-private/generated" --out build/startup --cache build/native-objects --trace-entries "$TRACE_ENTRIES" --trace-returns "$TRACE_RETURNS" "${extra[@]}"
      - uses: actions/setup-python@v7
        if: always() && (inputs.differential_entries != '' || inputs.snapshot_run_id != '') && steps.native_build.outcome == 'success'
        with:
          python-version: '3.12'
      - name: Install x86 reference test dependencies
        if: always() && (inputs.differential_entries != '' || inputs.snapshot_run_id != '') && steps.native_build.outcome == 'success'
        run: python3 -m pip install --disable-pip-version-check unicorn==2.1.4 numpy
      - name: Compare selected translations with original x86
        if: always() && inputs.differential_entries != '' && steps.native_build.outcome == 'success'
        run: |
          mkdir -p build/diagnostics
          python3 tools/differential/difftest.py "$RUNNER_TEMP/fnv-private/FalloutNV.exe" build/startup/libfnv-differential.dylib tools/differential/ghidra-x86-registers.json build/diagnostics/differential.json --only "$DIFF_ENTRIES" --trials 12 --jobs 2
      - name: Replay captured CRT math context against original x86
        if: always() && inputs.snapshot_run_id != '' && steps.native_build.outcome == 'success'
        run: |
          case "$SNAPSHOT_RUN_ID" in *[!0-9]*) exit 1;; esac
          gh run download "$SNAPSHOT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name FNV-startup-diagnostics-private --dir build/reference-snapshots
          python3 tools/differential/replay_math_snapshot.py "$RUNNER_TEMP/fnv-private/FalloutNV.exe" build/startup/libfnv-differential.dylib build/reference-snapshots --out build/diagnostics/math-differential.json
      - name: Execute strict startup with no game Data
        if: always() && inputs.input_tag != '' && steps.native_build.outcome == 'success'
        run: python3 tools/run_startup.py build/startup/fnv-startup "$RUNNER_TEMP/fnv-private/FalloutNV.exe" --out build/diagnostics
      - name: Discover missing entries on Mac without masking the strict result
        if: always() && inputs.input_tag != '' && inputs.discovery
        run: |
          test -x build/startup/fnv-discovery
          python3 tools/run_startup.py build/startup/fnv-discovery "$RUNNER_TEMP/fnv-private/FalloutNV.exe" --out build/diagnostics --label discovery
      - uses: actions/upload-artifact@v4
        if: always() && inputs.input_tag != ''
        with:
          name: FNV-startup-diagnostics-private
          path: build/diagnostics
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always() && inputs.input_tag != ''
        with:
          name: FNV-native-objects-private
          path: build/native-objects
          retention-days: 1
