name: Compile public iPhone game host
on: workflow_dispatch
permissions:
  contents: read
jobs:
  game-host:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tests/sync_shims_test.py
      - run: python3 tests/file_shims_case_test.py
      - run: python3 tools/build.py host-check --cache build/host-objects
      - run: python3 tools/build.py host-check --cache build/host-objects
