# Dispatch this workflow in the private build mirror; public repositories reject
# executable-derived inputs before downloading them.
name: Build approved private game inputs
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Standard macOS build runner (IPA target remains ARM64)
        type: choice
        default: macos-15
        options: [macos-15, macos-26, macos-15-intel, macos-26-intel]
      input_tag:
        description: Private temporary release tag approved by the owner
        required: true
        type: string
      input_sha256:
        description: SHA-256 of fnv-game-inputs.zip
        required: true
        type: string
      executable_sha256:
        description: SHA-256 of the exact locally analyzed executable
        required: true
        type: string
      cache_run_id:
        description: Optional prior private iOS object artifact run
        required: false
        type: string
      state_probes:
        description: Optional bounded JSON entry and receiver-field probes
        required: false
        default: '[]'
        type: string
      hybrid_input:
        description: Verified camera-only input compatibility call sites
        required: false
        default: '[]'
        type: string
      codecs_run_id:
        description: Pinned public native codecs artifact run
        required: false
        default: '41685697032'
        type: string
      codecs_repository:
        description: Repository containing the pinned public codec artifacts and cache
        required: false
        default: 'arjuk95-dot/FNV-iOS-Shim'
        type: string
      build_version:
        description: Optional numeric app build number independent of this repository run counter
        required: false
        default: ''
        type: string
      call_trace:
        description: Keep per-function diagnostic ring writes enabled
        required: false
        default: true
        type: boolean
permissions:
  contents: read
  actions: read
jobs:
  game:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_TAG: ${{ inputs.input_tag }}
      INPUT_SHA256: ${{ inputs.input_sha256 }}
      EXE_SHA256: ${{ inputs.executable_sha256 }}
      CACHE_RUN_ID: ${{ inputs.cache_run_id }}
      STATE_PROBES: ${{ inputs.state_probes }}
      HYBRID_INPUT: ${{ inputs.hybrid_input }}
      CODECS_RUN_ID: ${{ inputs.codecs_run_id }}
      CODECS_REPOSITORY: ${{ inputs.codecs_repository }}
      BUILD_VERSION: ${{ inputs.build_version }}
      CALL_TRACE: ${{ inputs.call_trace && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Require private repository
        run: test '${{ github.event.repository.private }}' = true
      - name: Download and validate approved inputs
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/fnv-download"
          gh release download "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --pattern fnv-game-inputs.zip --dir "$RUNNER_TEMP/fnv-download"
          python3 tools/game_inputs.py unpack "$RUNNER_TEMP/fnv-download/fnv-game-inputs.zip" "$RUNNER_TEMP/fnv-private" --archive-sha256 "$INPUT_SHA256" --exe-sha256 "$EXE_SHA256"
      - name: Compile and link translated game
        run: |
          case "$CODECS_RUN_ID" in ''|*[!0-9]*) exit 1;; esac
          python3 tools/fetch_codecs.py ios --run "$CODECS_RUN_ID" --repo "$CODECS_REPOSITORY" --out build/codecs-ios
          if [ -n "$CACHE_RUN_ID" ]; then
            case "$CACHE_RUN_ID" in *[!0-9]*) exit 1;; esac
            gh run download "$CACHE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name FNV-ios-objects-private --dir build/ios-objects
          fi
          trace_args=()
          case "$CALL_TRACE" in 1) ;; 0) trace_args+=(--no-call-trace);; *) exit 1;; esac
          python3 tools/build.py game --generated "$RUNNER_TEMP/fnv-private/generated" --exe "$RUNNER_TEMP/fnv-private/FalloutNV.exe" --jobs 2 --cache build/ios-objects --state-probes "$STATE_PROBES" --codec-prefix build/codecs-ios --hybrid-input "$HYBRID_INPUT" --version "${BUILD_VERSION:-$GITHUB_RUN_NUMBER}" "${trace_args[@]}"
      - name: Verify game IPA
        run: python3 tools/verify_ipa.py build/FNVGame.ipa --target game --receipt build/game-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: FNVGame-private-arm64
          path: |
            build/FNVGame.ipa
            build/game-validation.json
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: FNV-ios-objects-private
          path: build/ios-objects
          retention-days: 1
